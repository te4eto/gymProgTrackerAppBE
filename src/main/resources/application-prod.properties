spring.application.name=demo
spring.main.banner-mode=off

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG

# Thymeleaf
spring.thymeleaf.enabled=true

# === ONLY disable DB if NO_DATABASE=true ===
spring.autoconfigure.exclude=${NO_DATABASE:}

# Render port
server.port=${PORT:8080}

# ... other properties

# Spring will parse the user, password, and URL all from this one variable
spring.datasource.url=${DATABASE_URL}

# Explicitly set the dialect to prevent the error
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# This driver is usually auto-detected from the URL, but it's fine to keep
spring.datasource.driver-class-name=org.postgresql.Driver